services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: contract-risk-backend-demo
    restart: unless-stopped
    environment:
      DEMO_MODE: "true"
    ports:
      - "9527:9527"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: contract-risk-frontend-demo
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
